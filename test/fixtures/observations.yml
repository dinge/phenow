  created_at: <%= 60.days.ago %>
  updated_at: <%= 60.days.ago %>

plant_1_week_4_flower:
  plant: plant_1
  observed_by: marcus
  observed_at: <%= 32.days.ago %>
  stage: flowering
  overall_score: 9
  notes: "Incredible terpene development! Zkittlez fruit + GMO gas. Frost building."
  week_number: 4
  created_at: <%= 32.days.ago %>
  updated_at: <%= 32.days.ago %>

obs_1_flowering:
  plant: plant_1
  observed_by: sarah
  observed_at: <%= 30.days.ago %>
  stage: flowering
  overall_score: 9
  notes: "Week 4 flower - incredible frost development. Gassy grape aroma dominant. This one is special. Heavy resin production. Env - Temp 72F, RH 45%, 12/12 light"
  week_number: 4
  created_at: <%= 30.days.ago %>
  updated_at: <%= 30.days.ago %>

obs_1_harvest:
  plant: plant_1
  observed_by: marcus
  observed_at: <%= 14.days.ago %>
