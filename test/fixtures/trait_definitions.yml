# Key trait definitions for testing
# Full set is created in db/seeds.rb

overall_vigor:
  trait_category: vigor_health
  organization: ~
  name: Overall Vigor
  slug: overall-vigor
  description: General health and growth rate
  data_type: scale
  min_value: 1
  max_value: 10
  scale_labels:
    "1": Poor
    "5": Average
    "10": Excellent
  options: []
  applicable_stages:
    - seedling
    - vegetative
    - flowering
  display_order: 1
  system_default: true
  created_at: <%= 1.year.ago %>
  updated_at: <%= 1.year.ago %>

