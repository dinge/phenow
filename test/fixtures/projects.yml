# Active phenohunt project - main scenario
gmo_zkittlez_hunt:
  team: breeding_team
  strain: gmo_x_zkittlez
  name: GMO x Zkittlez F1 Hunt
  slug: gmo-zkittlez-f1-hunt
  project_type: phenohunt
  description: >
    Hunting for the perfect expression of GMO's potency and structure
    combined with Zkittlez's legendary terpene profile.
  status: active
  start_date: <%= 90.days.ago.to_date %>
  target_end_date: <%= 30.days.from_now.to_date %>
  seed_count: 10
  settings:
    observation_frequency: weekly
    require_photos: true
  created_at: <%= 90.days.ago %>
  updated_at: <%= 1.day.ago %>

